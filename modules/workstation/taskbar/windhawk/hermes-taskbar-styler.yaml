theme: ''

styleConstants:
  - IslandBackgroundColor=#0A0D12F8
  - IslandVerticalMargin=3
  - TaskbarFrameMaxWidth=980

controlStyles:
  - target: ':root > ScrollViewer > ScrollContentPresenter > Border > Grid'
    styles:
      - ColumnDefinitions:=<ColumnDefinitionCollection><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="*"/></ColumnDefinitionCollection>
      - HorizontalAlignment=Stretch
      - Background:=Transparent
      - ActualWidth=>containerGridWidth

  - target: Taskbar.TaskbarFrame
    styles:
      - Grid.Column=1
      - Width=Auto
      - HorizontalAlignment=Center
      - MaxWidth={{containerGridWidth>0?min($TaskbarFrameMaxWidth,containerGridWidth):$TaskbarFrameMaxWidth}}

  - target: Taskbar.TaskbarFrame > Grid
    styles:
      - Background:=<SolidColorBrush Color="$IslandBackgroundColor"/>
      - CornerRadius=12
      - Padding=12,0,12,0
      - Margin=0,$IslandVerticalMargin,0,$IslandVerticalMargin

  - target: SystemTray.SystemTrayFrame
    styles:
      - Grid.Column=2
      - Width=Auto
      - HorizontalAlignment=Right
      - Margin=0,0,0,0

  - target: StackPanel#SystemTrayFrameGrid, Grid#SystemTrayFrameGrid
    styles:
      - Background:=<SolidColorBrush Color="$IslandBackgroundColor"/>
      - CornerRadius=12,0,0,12
      - Padding=8,0,0,0
      - Margin=0,$IslandVerticalMargin,0,$IslandVerticalMargin

  - target: Taskbar.AugmentedEntryPointButton[AutomationProperties.AutomationId=WidgetsButton]
    styles:
      - Visibility=Collapsed

  - target: Taskbar.TaskbarBackground#BackgroundControl
    styles:
      - Visibility=Collapsed

  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill
    styles:
      - Fill=Transparent

  - target: SystemTray.LanguageTextIconContent
    styles:
      - Visibility=Collapsed

  - target: Taskbar.TaskbarExtensionElement
    styles:
      - Visibility=Collapsed

  - target: SystemTray.OmniButton#ControlCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter[1] > SystemTray.IconView > Grid > Grid
    styles:
      - Visibility=Collapsed

  - target: SystemTray.OmniButton#ControlCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter[2] > SystemTray.IconView > Grid > Grid
    styles:
      - Visibility=Visible

  - target: SystemTray.OmniButton#ControlCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter[3] > SystemTray.IconView > Grid > Grid
    styles:
      - Visibility=Collapsed

  - target: SystemTray.OmniButton#NotificationCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.IconView#SystemTrayIcon > Grid > Grid > SystemTray.TextIconContent
    styles:
      - Visibility=Collapsed

  - target: SystemTray.Stack#ShowDesktopStack
    styles:
      - Visibility=Collapsed

themeResourceVariables:
  - ''

clickThroughTaskbar: 1
xamlDiagnosticsHandling: alert

