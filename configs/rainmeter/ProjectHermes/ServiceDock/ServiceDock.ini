[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]

[Variables]
TileW=82
TileH=70
Radius=11
TileFill=5,8,13,215
TileBorder=42,50,65,190
IconColor=112,126,170,255
HoverColor=185,205,255,255
LabelColor=195,200,210,255
IconSize=30
IconX=26
LabelX=41
Font=Segoe UI

[Tile1]
Meter=Shape
X=0
Y=20
Shape=Rectangle 0,0,#TileW#,#TileH#,#Radius# | Fill Color #TileFill# | Stroke Color #TileBorder# | StrokeWidth 1

[Nextcloud]
Meter=Image
ImageName=#@#Icons\nextcloud.png
X=#IconX#
Y=27
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ImageTint=#IconColor#
ToolTipText=Nextcloud
LeftMouseUpAction=["https://nextcloud.example.invalid"]
MouseOverAction=[!SetOption Nextcloud ImageTint "#HoverColor#"][!UpdateMeter Nextcloud][!Redraw]
MouseLeaveAction=[!SetOption Nextcloud ImageTint "#IconColor#"][!UpdateMeter Nextcloud][!Redraw]

[NextcloudLabel]
Meter=String
X=#LabelX#
Y=58
StringAlign=Center
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
AntiAlias=1
Text=Nextcloud

