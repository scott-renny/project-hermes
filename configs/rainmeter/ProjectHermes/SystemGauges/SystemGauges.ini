[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[Variables]
RingBg=15,20,28,235
TextMain=220,225,235,245
TextSub=125,135,150,235
CPUColor=65,180,255,255
RAMColor=170,80,255,255
DiskColor=80,150,255,255

[CPUBackground]
Meter=Roundline
X=45
Y=45
W=90
H=90
StartAngle=4.712389
RotationAngle=6.283185
LineStart=35
LineLength=40
LineColor=#RingBg#
Solid=1
AntiAlias=1

[CPURing]
Meter=Roundline
MeasureName=MeasureCPU
X=45
Y=45
W=90
H=90
StartAngle=4.712389
RotationAngle=6.283185
LineStart=35
LineLength=40
LineColor=#CPUColor#
Solid=1
AntiAlias=1

[CPUValue]
