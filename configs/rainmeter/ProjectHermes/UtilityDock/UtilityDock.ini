[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]

[Variables]
TileW=82
TileH=74
Radius=11
TileFill=5,8,13,215
TileBorder=42,50,65,190
IconColor=112,126,170,255
HoverColor=185,205,255,255
LabelColor=195,200,210,255
IconSize=30
IconX=26
LabelX=41
Font=Segoe UI

[Tile1]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#TileW#,#TileH#,#Radius# | Fill Color #TileFill# | Stroke Color #TileBorder# | StrokeWidth 1

[Projects]
Meter=Image
ImageName=#@#Icons\projects.png
X=#IconX#
Y=8
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ImageTint=#IconColor#
ToolTipText=Projects
LeftMouseUpAction=["explorer.exe" "%USERPROFILE%\Projects"]
MouseOverAction=[!SetOption Projects ImageTint "#HoverColor#"][!UpdateMeter Projects][!Redraw]
MouseLeaveAction=[!SetOption Projects ImageTint "#IconColor#"][!UpdateMeter Projects][!Redraw]

[ProjectsLabel]
Meter=String
X=#LabelX#
Y=39
StringAlign=Center
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
AntiAlias=1
Text=Projects

[Tile2]
Meter=Shape
X=0
Y=82
Shape=Rectangle 0,0,#TileW#,#TileH#,#Radius# | Fill Color #TileFill# | Stroke Color #TileBorder# | StrokeWidth 1

[Terminal]
Meter=Image
ImageName=#@#Icons\terminal.png
X=#IconX#
Y=90
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ImageTint=#IconColor#
ToolTipText=Windows Terminal
LeftMouseUpAction=["wt.exe"]
MouseOverAction=[!SetOption Terminal ImageTint "#HoverColor#"][!UpdateMeter Terminal][!Redraw]
MouseLeaveAction=[!SetOption Terminal ImageTint "#IconColor#"][!UpdateMeter Terminal][!Redraw]

[TerminalLabel]
Meter=String
X=#LabelX#
Y=121
StringAlign=Center
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
AntiAlias=1
Text=Terminal

[Tile3]
Meter=Shape
X=0
Y=164
Shape=Rectangle 0,0,#TileW#,#TileH#,#Radius# | Fill Color #TileFill# | Stroke Color #TileBorder# | StrokeWidth 1

[SSH]
Meter=Image
ImageName=#@#Icons\ssh.png
X=#IconX#
Y=172
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ImageTint=#IconColor#
ToolTipText=SSH - hermes-remote-host
LeftMouseUpAction=["wt.exe" "ssh" "hermes-remote-host"]
MouseOverAction=[!SetOption SSH ImageTint "#HoverColor#"][!UpdateMeter SSH][!Redraw]
MouseLeaveAction=[!SetOption SSH ImageTint "#IconColor#"][!UpdateMeter SSH][!Redraw]

[SSHLabel]
Meter=String
X=#LabelX#
Y=203
StringAlign=Center
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
AntiAlias=1
Text=SSH

[Tile4]
Meter=Shape
X=0
Y=246
Shape=Rectangle 0,0,#TileW#,#TileH#,#Radius# | Fill Color #TileFill# | Stroke Color #TileBorder# | StrokeWidth 1

[Settings]
Meter=Image
ImageName=#@#Icons\settings.png
X=#IconX#
Y=254
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ImageTint=#IconColor#
ToolTipText=Windows Settings
LeftMouseUpAction=["ms-settings:"]
MouseOverAction=[!SetOption Settings ImageTint "#HoverColor#"][!UpdateMeter Settings][!Redraw]
MouseLeaveAction=[!SetOption Settings ImageTint "#IconColor#"][!UpdateMeter Settings][!Redraw]

[SettingsLabel]
Meter=String
X=#LabelX#
Y=285
StringAlign=Center
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
AntiAlias=1
Text=Settings


