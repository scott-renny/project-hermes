[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2][!CommandMeasure MeasureCOC "Run"][!CommandMeasure MeasureWiFi "Run"][!CommandMeasure MeasureBattery "Run"]

[Variables]
PanelW=360
PanelH=64
PanelFill=4,8,14,225
PanelBorder=35,45,60,210
TextMain=225,230,240,255
TextSub=145,155,170,245
Green=40,210,125,255
Red=235,85,85,255
IconTint=185,200,225,255
Font=Segoe UI

[MeasureTrigger]
Measure=Calc
Formula=Counter
UpdateDivider=15
OnUpdateAction=[!CommandMeasure MeasureCOC "Run"][!CommandMeasure MeasureWiFi "Run"][!CommandMeasure MeasureBattery "Run"]

[MeasureCOC]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\hermes-coc-status.ps1"
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeasure MeasureCOCState][!UpdateMeter MeterCOCState][!Redraw]

[MeasureCOCState]
Measure=String
String=[MeasureCOC]
DynamicVariables=1
IfMatch=Online
IfMatchAction=[!SetOption MeterCOCDot FontColor "#Green#"][!UpdateMeter MeterCOCDot][!Redraw]
IfNotMatchAction=[!SetOption MeterCOCDot FontColor "#Red#"][!UpdateMeter MeterCOCDot][!Redraw]

[MeasureWiFi]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\hermes-wifi-status.ps1"
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeter MeterWiFiValue][!Redraw]

[MeasureBattery]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\hermes-battery-status.ps1"
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeter MeterBatteryValue][!Redraw]

[Panel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#PanelW#,#PanelH#,14 | Fill Color #PanelFill# | Stroke Color #PanelBorder# | StrokeWidth 1

[MeterCOCDot]
Meter=String
X=18
Y=18
FontFace=Segoe UI Symbol
FontSize=12
FontColor=#Green#
AntiAlias=1
Text=●

[MeterCOCLabel]
Meter=String
X=40
Y=9
FontFace=#Font#
FontSize=11
FontColor=#TextMain#
AntiAlias=1
Text=COC

[MeterCOCState]
Meter=String
MeasureName=MeasureCOC
X=40
Y=31
FontFace=#Font#
FontSize=8
FontColor=#TextSub#
AntiAlias=1
Text=%1

[Divider1]
Meter=Shape
X=115
Y=12
Shape=Line 0,0,0,40 | Stroke Color 45,55,70,180 | StrokeWidth 1

[MeterWiFiIcon]
Meter=Image
ImageName=#@#Icons\wifi.png
X=132
Y=20
W=20
H=20
PreserveAspectRatio=1
ImageTint=#IconTint#

[MeterWiFiLabel]
Meter=String
X=160
Y=9
FontFace=#Font#
FontSize=11
FontColor=#TextMain#
AntiAlias=1
Text=Wi-Fi

[MeterWiFiValue]
Meter=String
MeasureName=MeasureWiFi
X=160
Y=31
W=68
ClipString=1
FontFace=#Font#
FontSize=8
FontColor=#TextSub#
AntiAlias=1
Text=%1

[Divider2]
Meter=Shape
X=238
Y=12
Shape=Line 0,0,0,40 | Stroke Color 45,55,70,180 | StrokeWidth 1

[MeterBatteryIcon]
Meter=Image
ImageName=#@#Icons\battery.png
X=254
Y=20
W=20
H=20
PreserveAspectRatio=1
ImageTint=#IconTint#

[MeterBatteryLabel]
Meter=String
X=282
Y=9
FontFace=#Font#
FontSize=11
FontColor=#TextMain#
AntiAlias=1
Text=Battery

[MeterBatteryValue]
Meter=String
MeasureName=MeasureBattery
X=282
Y=31
W=70
ClipString=1
FontFace=#Font#
FontSize=8
FontColor=#TextSub#
AntiAlias=1
Text=%1

[WiFiHitbox]
Meter=Shape
X=116
Y=0
Shape=Rectangle 0,0,122,64,0 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["explorer.exe" "ms-availablenetworks:"]
RightMouseUpAction=["explorer.exe" "ms-settings:network-wifi"]
MouseActionCursor=1

[BatteryHitbox]
Meter=Shape
X=239
Y=0
Shape=Rectangle 0,0,121,64,0 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["explorer.exe" "ms-settings:powersleep"]
MouseActionCursor=1

