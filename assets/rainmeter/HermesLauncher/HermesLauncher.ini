[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2][!ClickThrough 0][!Draggable 0]
MouseActionCursor=1
ContextTitle=Edit Hermes launcher settings
ContextAction=["notepad.exe" "#CURRENTPATH#HermesLauncher.settings.psd1"]

[Metadata]
Name=Hermes Gothic Icon Launcher
Author=Project Hermes
Information=Compact icon launcher aligned to the gothic desktop frame.
Version=0.7.4

@Include=#@#HermesVisual.inc

[Variables]
Column1=30
Column2=90
Column3=150
Column4=210

[Bounds]
Meter=Shape
Shape=Rectangle 0,0,240,790 | Fill Color 0,0,0,1 | StrokeWidth 0

[SectionStyle]
Meter=String
FontFace=#MonoFontFace#
FontSize=7
FontWeight=600
FontColor=#AccentColor#
StringAlign=Center
AntiAlias=1

[TileStyle]
Meter=String
W=54
H=46
StringAlign=Center
FontFace=Segoe UI Symbol
FontSize=8
FontColor=#AccentColor#
AntiAlias=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "220,165,255,255"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#AccentColor#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; APPLICATIONS
[Applications]
MeterStyle=SectionStyle
X=120
Y=18
Text=APPLICATIONS

[Discord]
MeterStyle=TileStyle
X=#Column1#
Y=48
Text=◆#CRLF#DISCORD
LeftMouseUpAction=["pwsh.exe" "-NoProfile" "-WindowStyle" "Hidden" "-File" "#CURRENTPATH#Invoke-HermesLauncher.ps1" "-Action" "discord"]

