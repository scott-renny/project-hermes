[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]
ContextTitle=Edit Hermes sidebar
ContextAction=["notepad.exe" "#CURRENTPATH#HermesSidebar.ini"]

[Metadata]
Name=Hermes Gothic Command Sidebar
Author=Project Hermes
Information=Unified clock, system, network, tasks, and notes sidebar.
Version=0.7.0

@Include=#@#HermesVisual.inc

[Variables]
Task1=Review Project Hermes progress
Task2=Check systems and updates
Task3=Plan the next engineering task
Task4=Review alerts and outstanding work
Note1=Information is the lifeblood of operation.
Note2=Speed and clarity win every time.

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %#d, %Y

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[Background]
Meter=Shape
Shape=Rectangle 1,1,300,800,5 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[Clock]
Meter=String
MeasureName=MeasureTime
X=150
Y=18
StringAlign=Center
FontFace=#MonoFontFace#
FontSize=27
FontColor=#AccentColor#
AntiAlias=1

[Date]
Meter=String
MeasureName=MeasureDate
X=150
Y=70
StringAlign=Center
StringCase=Upper
FontFace=#MonoFontFace#
FontSize=8
FontColor=#TextColor#
AntiAlias=1

[SystemHeader]
Meter=String
X=18
Y=118
Text=SYSTEM OVERVIEW
FontFace=#MonoFontFace#
FontSize=10
FontColor=#AccentColor#
AntiAlias=1

[CPU]
Meter=String
MeasureName=MeasureCPU
X=18
Y=150
Text=CPU                                  %1%
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[CPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=18
Y=174
W=264
H=4
BarColor=#AccentColor#
SolidColor=40,32,52,255
BarOrientation=Horizontal

[RAM]
Meter=String
MeasureName=MeasureRAM
X=18
Y=190
Text=RAM                                  %1%
Percentual=1
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[RAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=18
Y=214
W=264
H=4
BarColor=#AccentColor#
SolidColor=40,32,52,255
BarOrientation=Horizontal

[Disk]
Meter=String
MeasureName=MeasureDisk
X=18
Y=230
Text=STORAGE                              %1%
Percentual=1
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[DiskBar]
Meter=Bar
MeasureName=MeasureDisk
X=18
Y=254
W=264
H=4
BarColor=#AccentColor#
SolidColor=40,32,52,255
BarOrientation=Horizontal

[NetworkHeader]
Meter=String
X=18
Y=282
Text=NETWORK STATUS
FontFace=#MonoFontFace#
FontSize=10
FontColor=#AccentColor#
AntiAlias=1

[Download]
Meter=String
MeasureName=MeasureNetIn
X=18
Y=314
Text=DOWN  %1B/s
AutoScale=1
NumOfDecimals=1
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[Upload]
Meter=String
MeasureName=MeasureNetOut
X=282
Y=314
StringAlign=Right
Text=UP  %1B/s
AutoScale=1
NumOfDecimals=1
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[NetworkGraph]
Meter=Line
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=18
Y=344
W=264
H=64
LineColor=#AccentColor#
LineColor2=#AccentSoft#
LineWidth=1
AutoScale=1
AntiAlias=1

[TasksHeader]
Meter=String
X=18
Y=430
Text=ACTIVE TASKS
FontFace=#MonoFontFace#
FontSize=10
FontColor=#AccentColor#
AntiAlias=1

[Tasks]
Meter=String
X=18
Y=460
W=264
H=126
ClipString=2
Text=01  #Task1##CRLF#02  #Task2##CRLF#03  #Task3##CRLF#04  #Task4#
FontFace=#FontFace#
FontSize=9
FontColor=#TextColor#
InlineSetting=CharacterSpacing | 0.3
AntiAlias=1
LeftMouseDoubleClickAction=["notepad.exe" "#CURRENTPATH#HermesSidebar.ini"]

[NotesHeader]
Meter=String
X=18
Y=612
Text=NOTES
FontFace=#MonoFontFace#
FontSize=10
FontColor=#AccentColor#
AntiAlias=1

[Notes]
Meter=String
X=18
Y=644
W=264
H=112
ClipString=2
Text=#Note1##CRLF##Note2#
FontFace=#FontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
LeftMouseDoubleClickAction=["notepad.exe" "#CURRENTPATH#HermesSidebar.ini"]

[Status]
Meter=String
X=18
Y=770
Text=PROJECT HERMES  /  OPERATIONAL
FontFace=#MonoFontFace#
FontSize=8
FontColor=#GoodColor#
AntiAlias=1
