[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]
ContextTitle=Edit Hermes notes
ContextAction=["notepad.exe" "#CURRENTPATH#Notes.inc"]

[Metadata]
Name=Hermes Notes
Author=Project Hermes
Information=Editable desktop notes. Double-click the note body to edit.
Version=0.7.0

@Include=#@#HermesVisual.inc
@Include2=#CURRENTPATH#Notes.inc

[Background]
Meter=Shape
Shape=Rectangle 1,1,344,210,8 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[Header]
Meter=String
X=24
Y=20
Text=NOTES
FontFace=#MonoFontFace#
FontSize=11
FontColor=#AccentColor#
AntiAlias=1

[EditHint]
Meter=String
X=320
Y=22
StringAlign=Right
Text=DOUBLE-CLICK TO EDIT
FontFace=#MonoFontFace#
FontSize=7
FontColor=#AccentSoft#
AntiAlias=1

[Divider]
Meter=Shape
Shape=Line 24,48,320,48 | StrokeWidth 1 | Stroke Color #BorderColor#

[NoteBody]
Meter=String
X=24
Y=64
W=296
H=126
ClipString=2
Text=#Note1##CRLF##Note2##CRLF##Note3##CRLF##Note4##CRLF##Note5#
FontFace=#FontFace#
FontSize=10
FontColor=#TextColor#
AntiAlias=1
LeftMouseDoubleClickAction=["notepad.exe" "#CURRENTPATH#Notes.inc"]
