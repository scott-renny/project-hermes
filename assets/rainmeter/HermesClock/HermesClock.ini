[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]

[Metadata]
Name=Hermes Gothic Clock
Author=Project Hermes
Version=0.7.0

@Include=#@#HermesVisual.inc

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %#d, %Y

[Background]
Meter=Shape
Shape=Rectangle 1,1,344,126,8 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[Clock]
Meter=String
MeasureName=MeasureTime
X=172
Y=20
StringAlign=Center
FontFace=#MonoFontFace#
FontSize=28
FontColor=#AccentColor#
AntiAlias=1

[Date]
Meter=String
MeasureName=MeasureDate
X=172
Y=78
StringAlign=Center
StringCase=Upper
FontFace=#MonoFontFace#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
